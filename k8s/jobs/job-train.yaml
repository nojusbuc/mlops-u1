apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: mlops-u1
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: train
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: train
          # Tik sha-<commit> tag'as, ne latest; `make job` jį pakeičia į esamą
          image: ghcr.io/nojusbuc/mlops-u1/train:sha-b8412c35
          imagePullPolicy: IfNotPresent
          args: ["python", "src/train.py", "--C=$(C)", "--max_features=$(MAX_FEATURES)", "--ngram_max=$(NGRAM_MAX)"]
          envFrom:
            - configMapRef:
                name: training-config
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
