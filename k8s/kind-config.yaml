# Vieno mazgo kind klasteris. Portų susiejimą galima nustatyti tik kuriant klasterį.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops-u1
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraPortMappings:
      # MLflow NodePort 30500 -> kompiuterio 127.0.0.1:5050 (5000 macOS užima AirPlay)
      - containerPort: 30500
        hostPort: 5050
        listenAddress: "127.0.0.1"
