stages:
  prepare:
    cmd: python src/data_prep.py
    deps:
      - src/data_prep.py
      - data/raw
    params:
      - prepare
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.parquet
    params:
      - train
    outs:
      - models/model.pkl
      - models/run_id.txt:
          cache: false   # mažas, Git'e: kiekvienas commit'as žino savo MLflow run'ą
  evaluate:
    cmd: python src/eval.py
    deps:
      - src/eval.py
      - models/model.pkl
      - models/run_id.txt
      - data/processed/test.parquet
    metrics:
      - metrics.json:
          cache: false
